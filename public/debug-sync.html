<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player Sync Debug</title>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: #fff;
            font-family: 'Orbitron', monospace;
        }
        .debug-panel {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #0ff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .debug-info {
            margin: 10px 0;
            font-size: 12px;
        }
        .status-good { color: #0f0; }
        .status-bad { color: #f00; }
        .status-warn { color: #ff0; }
    </style>
</head>
<body>
    <h1>Radio Player Sync Debug</h1>
    
    <div class="debug-panel">
        <h3>Main Player Status</h3>
        <div id="main-status" class="debug-info">Checking...</div>
    </div>
    
    <div class="debug-panel">
        <h3>Radio Player Status</h3>
        <div id="radio-status" class="debug-info">Checking...</div>
    </div>
    
    <div class="debug-panel">
        <h3>Sync Status</h3>
        <div id="sync-status" class="debug-info">Checking...</div>
    </div>
    
    <div class="debug-panel">
        <h3>Test Release Showcase</h3>
        <div class="release-viewer">
            <img id="cover" src="" class="cover-art" style="width: 200px; height: 200px;" />
            <h2 id="title">Loading...</h2>
            <div class="carousel-nav">
                <button class="nav left">PREV</button>
                <button class="nav right">NEXT</button>
            </div>
            <audio id="player" controls></audio>
            <a id="download" href="#" download class="download">Download</a>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/radio-player.js"></script>
    
    <script>
        function updateDebugInfo() {
            // Main Player Status
            const mainPlayer = document.querySelector('#player');
            const mainStatus = document.getElementById('main-status');
            
            if (mainPlayer) {
                const hasReleases = window.releases && window.releases.length > 0;
                const hasCurrent = typeof window.current !== 'undefined';
                
                mainStatus.innerHTML = `
                    <div class="${mainPlayer.src ? 'status-good' : 'status-bad'}">Source: ${mainPlayer.src || 'None'}</div>
                    <div class="${hasReleases ? 'status-good' : 'status-bad'}">Releases: ${hasReleases ? window.releases.length : 'Not loaded'}</div>
                    <div class="${hasCurrent ? 'status-good' : 'status-bad'}">Current Index: ${hasCurrent ? window.current : 'Not set'}</div>
                    <div>Ready State: ${mainPlayer.readyState}</div>
                `;
            } else {
                mainStatus.innerHTML = '<div class="status-bad">Main player not found</div>';
            }
            
            // Radio Player Status
            const radioStatus = document.getElementById('radio-status');
            const radioInstance = window.xalphericRadioInstance;
            
            if (radioInstance) {
                radioStatus.innerHTML = `
                    <div class="${radioInstance.playlist.length > 0 ? 'status-good' : 'status-bad'}">Playlist: ${radioInstance.playlist.length} tracks</div>
                    <div>Current Track: ${radioInstance.currentTrack}</div>
                    <div class="${radioInstance.homePlayer ? 'status-good' : 'status-bad'}">Home Player: ${radioInstance.homePlayer ? 'Connected' : 'Not connected'}</div>
                    <div class="${radioInstance.isHomePage ? 'status-good' : 'status-warn'}">Is Home Page: ${radioInstance.isHomePage}</div>
                `;
            } else {
                radioStatus.innerHTML = '<div class="status-bad">Radio player not initialized</div>';
            }
            
            // Sync Status
            const syncStatus = document.getElementById('sync-status');
            
            if (radioInstance && radioInstance.homePlayer && window.releases) {
                const mainCurrentTrack = window.current || 0;
                const radioCurrentTrack = radioInstance.currentTrack || 0;
                const isInSync = mainCurrentTrack === radioCurrentTrack;
                
                syncStatus.innerHTML = `
                    <div class="${isInSync ? 'status-good' : 'status-bad'}">In Sync: ${isInSync ? 'YES' : 'NO'}</div>
                    <div>Main Track: ${mainCurrentTrack} (${window.releases[mainCurrentTrack]?.title || 'Unknown'})</div>
                    <div>Radio Track: ${radioCurrentTrack} (${radioInstance.playlist[radioCurrentTrack]?.title || 'Unknown'})</div>
                `;
            } else {
                syncStatus.innerHTML = '<div class="status-warn">Cannot determine sync status</div>';
            }
        }
        
        // Update debug info every second
        setInterval(updateDebugInfo, 1000);
        
        // Manual sync test button
        const syncButton = document.createElement('button');
        syncButton.textContent = 'Force Sync';
        syncButton.onclick = () => {
            if (window.xalphericRadioInstance) {
                window.xalphericRadioInstance.syncWithHomePlayer();
                updateDebugInfo();
            }
        };
        document.body.appendChild(syncButton);
    </script>
</body>
</html>
